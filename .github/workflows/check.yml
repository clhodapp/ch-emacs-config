# SPDX-License-Identifier: MIT
#
# The trusted check: it runs on pushes to main and on pull requests,
# and it is the run that reads and writes the build cache scoped to
# main. A cold runner native-compiles the whole Emacs package set (the
# better part of an hour); with the cache restored, a run builds only
# what changed.
#
# A pull request is checked through `pull_request_target`, so this file
# is taken from main, not from the pull request. That is what makes the
# cache safe to write from a pull request: the request cannot edit the
# steps that decide whether to save. The one thing a request could use
# to reach the runner's store outside Nix's sandbox is this pipeline
# itself, so a request that touches .github/ gets no build here at all;
# check-pr.yml builds it instead, under its own cache scope, which main
# can never restore. Nothing else from the checkout runs outside Nix:
# the only command from the tree is `nix flake check`, evaluation is
# pure, and the sandbox stays on.
#
# One cache entry, holding a union of builds. What stays in it is
# decided by garbage-collection roots kept in a tree the cache carries,
# /nix/ci-roots, and mirrored into Nix's root directory before each
# save: main/<sha> for main's builds, pr/<number>/<sha> for requests'.
# Each run adds its
# own, drops the lowest-priority roots until the closure fits the
# repository's 10 GB of cache, and then every unreachable path goes.
# The priority order, highest first: the current main; each open
# request's newest build; older mains; closed requests. Requests that
# changed the pipeline have entries of their own in their scope, which
# this run only ever deletes, closed ones first, when space is short.

name: check

on:
  push:
    branches: [main]
  pull_request_target:
  workflow_dispatch:

# Read-only on contents, including for pull_request_target, which would
# otherwise get a write token. `actions: write` is for deleting cache
# entries when the budget requires it.
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Decide whether this run builds
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
               --jq '.[].filename' | grep -q '^\.github/'; then
            echo "This pull request changes the pipeline; check-pr.yml builds it."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The pull request's head by SHA, never by branch name, so a push
      # after the guard ran cannot swap the tree under it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.guard.outputs.build == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: steps.guard.outputs.build == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      # Restores the newest entry, saves under this commit's key, purges
      # the older entries after the save. The cap of zero makes the
      # pruning before the save remove every path the roots do not
      # reach, so the entry is exactly the closure of the roots.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        if: steps.guard.outputs.build == 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 0
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Run the flake checks
        if: steps.guard.outputs.build == 'true'
        run: nix flake check --print-build-logs

      - name: Root this build and apply the cache priorities
        if: steps.guard.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Where this run's roots go, and which main is current.
          ROOT_CLASS: ${{ github.event.pull_request && 'pr' || 'main' }}
          ROOT_ID: ${{ github.event.pull_request && format('{0}/{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.sha }}
          CURRENT_MAIN: ${{ github.event.pull_request.base.sha || github.sha }}
          # This run's own cache scope, for the budget arithmetic.
          OWN_REF: ${{ github.ref }}
          KEY_PREFIX: nix-${{ runner.os }}-
          MAY_DELETE: "true"
        run: |
          set -euo pipefail
          # The persistent root tree. It lives under /nix so the cache
          # carries it, but not under /nix/var/nix, which the cache
          # action excludes from its archive apart from the database.
          # Nix reads roots only from /nix/var/nix/gcroots, so the last
          # step mirrors the surviving tree there before the save's
          # pruning runs.
          roots=/nix/ci-roots

          # 1. Root what this run built. The checks are already built,
          #    so this evaluates and links.
          own="$roots/$ROOT_CLASS/$ROOT_ID"
          sudo rm -rf "$own"
          sudo mkdir -p "$own"
          for name in $(nix eval --json '.#checks.x86_64-linux' --apply builtins.attrNames | jq -r '.[]'); do
            out=$(nix build --no-link --print-out-paths ".#checks.x86_64-linux.$name")
            sudo ln -s "$out" "$own/$name"
          done

          # 2. Order every root directory, highest priority first. Older
          #    builds of the same request are superseded outright.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number --jq '.[].number')
          is_open() { grep -qx "$1" <<<"$open"; }
          # Entry names under a directory, newest first by modification time.
          newest_in() {
            [[ -d "$1" ]] || return 0
            find "$1" -mindepth 1 -maxdepth 1 -printf '%T@ %f\n' | sort -rn | awk '{print $2}'
          }
          ordered=()
          [[ -d "$roots/main/$CURRENT_MAIN" ]] && ordered+=("$roots/main/$CURRENT_MAIN")
          shopt -s nullglob
          for prdir in "$roots"/pr/*/; do
            n=$(basename "$prdir")
            newest=$(newest_in "$prdir" | head -n1)
            for sha in "$prdir"/*/; do
              [[ "$(basename "$sha")" == "$newest" ]] || sudo rm -rf "$sha"
            done
            is_open "$n" && ordered+=("$prdir$newest")
          done
          for sha in $(newest_in "$roots/main"); do
            [[ "$sha" == "$CURRENT_MAIN" ]] || ordered+=("$roots/main/$sha")
          done
          for prdir in "$roots"/pr/*/; do
            n=$(basename "$prdir")
            is_open "$n" || ordered+=("$prdir$(newest_in "$prdir" | head -n1)")
          done

          # 3. The budget: the repository's 10 GB, less the entries of
          #    requests that changed the pipeline (they live in their own
          #    scopes), less this scope's current entry, which coexists
          #    with the new one until the purge after the save. Sizes
          #    are compared as uncompressed closure sizes, which errs on
          #    the safe side since entries are compressed.
          gib=$((1024 * 1024 * 1024))
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json key,ref,sizeInBytes,lastAccessedAt)
          used_by_own_scope=$(jq --arg ref "$OWN_REF" --arg p "$KEY_PREFIX" \
            '[.[] | select(.ref == $ref and (.key | startswith($p))) | .sizeInBytes] | add // 0' <<<"$caches")
          used_by_others=$(jq --arg ref "$OWN_REF" \
            '[.[] | select(.ref != $ref) | .sizeInBytes] | add // 0' <<<"$caches")
          budget=$((10 * gib - used_by_own_scope - used_by_others))
          echo "Budget for this entry: $budget bytes ($used_by_others used by other scopes, $used_by_own_scope by this one)."

          closure_size() {
            # Union closure size of the roots under the given directories.
            local targets
            targets=$(for d in "$@"; do find "$d" -maxdepth 1 -type l -exec readlink {} +; done)
            [[ -n "$targets" ]] || { echo 0; return; }
            # shellcheck disable=SC2086
            nix path-info -r $targets | sort -u | xargs nix path-info -s | awk '{s += $2} END {print s + 0}'
          }

          # 4. Keep the highest-priority roots that fit, drop the rest.
          #    If not even the current main fits, make room by deleting
          #    pipeline requests' entries, closed ones first, then the
          #    oldest open ones.
          kept=()
          for d in "${ordered[@]}"; do
            size=$(closure_size "${kept[@]}" "$d")
            if (( size <= budget )); then
              kept+=("$d")
              continue
            fi
            if (( ${#kept[@]} == 0 )) && [[ "$MAY_DELETE" == "true" ]]; then
              while (( size > budget )); do
                victim=$(jq -r --arg ref "$OWN_REF" \
                  '[.[] | select(.ref != $ref)] | sort_by(.lastAccessedAt) | .[0].ref // empty' <<<"$caches")
                [[ -n "$victim" ]] || break
                n=$(sed -E 's|refs/pull/([0-9]+)/merge|\1|' <<<"$victim")
                if is_open "$n"; then
                  # Closed ones first: pick the oldest closed entry if any remain.
                  closed_victim=$(jq -r --arg ref "$OWN_REF" --argjson open "[$(paste -sd, <<<"$open")]" \
                    '[.[] | select(.ref != $ref) | select((.ref | capture("refs/pull/(?<n>[0-9]+)/merge").n | tonumber) as $n | ($open | index($n)) == null)] | sort_by(.lastAccessedAt) | .[0].ref // empty' <<<"$caches")
                  [[ -n "$closed_victim" ]] && victim=$closed_victim
                fi
                echo "Deleting cache entries for $victim to make room."
                gh cache delete --all --ref "$victim" --succeed-on-no-caches --repo "$GITHUB_REPOSITORY"
                caches=$(jq --arg ref "$victim" '[.[] | select(.ref != $ref)]' <<<"$caches")
                used_by_others=$(jq --arg ref "$OWN_REF" '[.[] | select(.ref != $ref) | .sizeInBytes] | add // 0' <<<"$caches")
                budget=$((10 * gib - used_by_own_scope - used_by_others))
              done
              if (( size <= budget )); then
                kept+=("$d")
                continue
              fi
              echo "::warning::The current main build ($size bytes) exceeds the cache budget ($budget bytes); saving it anyway."
              kept+=("$d")
              continue
            fi
            echo "Dropping roots $d (closure would be $size bytes, budget $budget)."
            sudo rm -rf "$d"
          done
          echo "Kept roots:"
          printf '  %s\n' "${kept[@]}"

          # 5. Mirror the surviving tree into Nix's root directory so the
          #    pruning before the save honours it (symlinks stay symlinks).
          sudo rm -rf /nix/var/nix/gcroots/ci
          sudo cp -a "$roots" /nix/var/nix/gcroots/ci
